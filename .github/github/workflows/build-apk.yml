name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository code onto the virtual machine
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Java Development Kit (JDK 17 is standard for modern Android projects)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # 3. Give execution permissions to the Gradle wrapper script
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Run Gradle command to compile the Debug APK
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 5. Save the generated APK file so you can download it from GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
